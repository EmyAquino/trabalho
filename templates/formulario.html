{% extends "base.html" %}

{% block titulo %}
Formulário de Submissão - PEnsE-Submite
{% endblock %}

{% block conteudo %}

<style>

    .formulario {
        max-width: 650px;
        margin: 35px auto;
        padding: 30px 40px;
        background-color: #b8b8b8;
        border-radius: 25px;
        box-sizing: border-box;
    }

    .formulario__titulo {
        background-color: #ffffff;
        color: #59683d;
        text-align: center;
        font-size: 26px;
        font-weight: normal;
        padding: 12px;
        margin: -10px 0 30px 0;
        border-radius: 8px;
    }

    .campo {
        margin-bottom: 22px;
    }

    .campo label {
        display: block;
        margin-bottom: 7px;
        color: #222222;
        font-size: 18px;
    }

    .campo__entrada {
        border-bottom: 3px solid #b4e337;
    }

    .campo__entrada input,
    .campo__entrada textarea,
    .campo__entrada select {
        width: 100%;
        padding: 8px 5px;
        border: none;
        outline: none;
        background-color: transparent;
        font-size: 16px;
        font-family: inherit;
        box-sizing: border-box;
    }

    .campo__entrada input::placeholder,
    .campo__entrada textarea::placeholder {
        color: #666666;
    }

    .campo__entrada textarea {
        min-height: 110px;
        resize: vertical;
    }

    .campo__entrada select {
        cursor: pointer;
    }

    .contador {
        display: block;
        margin-top: 5px;
        color: #555555;
        font-size: 12px;
        text-align: right;
    }

    .arquivo {
        margin-top: 20px;
        margin-bottom: 25px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }

    .arquivo input[type="file"] {
        display: none;
    }

    .botao-arquivo {
        display: inline-block;
        background-color: #ffffff;
        color: #59683d;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
    }

    .botao-arquivo:hover {
        background-color: #a8cf45;
        color: #ffffff;
    }

    #nome-arquivo {
        color: #555555;
        font-size: 13px;
        word-break: break-word;
    }

    .formulario__acoes {
        display: flex;
        justify-content: flex-end;
        margin-top: 15px;
    }

    .botao--principal {
        background-color: #ffffff;
        color: #59683d;
        border: none;
        border-radius: 8px;
        padding: 10px 30px;
        font-size: 17px;
        font-family: inherit;
        cursor: pointer;
        transition: 0.2s;
    }

    .botao--principal:hover {
        background-color: #a8cf45;
        color: #ffffff;
    }

    @media (max-width: 700px) {

        .formulario {
            margin: 20px 15px;
            padding: 25px 20px;
        }

        .formulario__titulo {
            font-size: 21px;
        }

        .formulario__acoes {
            justify-content: center;
        }
    }

</style>


<section class="formulario">

    <h1 class="formulario__titulo">
        Formulário de Submissão
    </h1>

    <form method="POST" enctype="multipart/form-data">


        <div class="campo">

            <label for="titulo">
                Título do Trabalho:
            </label>

            <div class="campo__entrada">

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Digite o título do trabalho"
                    required
                >

            </div>

        </div>


        <div class="campo">

            <label for="autor">
                Nome do Autor:
            </label>

            <div class="campo__entrada">

                <input
                    type="text"
                    id="autor"
                    name="autor"
                    placeholder="Digite o nome do autor"
                    required
                >

            </div>

        </div>


        <div class="campo">

            <label for="instituicao">
                Instituição:
            </label>

            <div class="campo__entrada">

                <select
                    id="instituicao"
                    name="instituicao"
                    required
                >

                    <option value="" disabled selected>
                        Selecione uma instituição
                    </option>

                    <option value="IFAC">Instituto Federal do Acre - IFAC</option>

                    <option value="IFAL">Instituto Federal de Alagoas - IFAL</option>

                    <option value="IFAP">Instituto Federal do Amapá - IFAP</option>

                    <option value="IFAM">Instituto Federal do Amazonas - IFAM</option>

                    <option value="IFBA">Instituto Federal da Bahia - IFBA</option>

                    <option value="IFBaiano">Instituto Federal Baiano - IF Baiano</option>

                    <option value="IFB">Instituto Federal de Brasília - IFB</option>

                    <option value="IFCE">Instituto Federal do Ceará - IFCE</option>

                    <option value="IFES">Instituto Federal do Espírito Santo - IFES</option>

                    <option value="IFG">Instituto Federal de Goiás - IFG</option>

                    <option value="IFGoiano">Instituto Federal Goiano - IF Goiano</option>

                    <option value="IFMA">Instituto Federal do Maranhão - IFMA</option>

                    <option value="IFMT">Instituto Federal de Mato Grosso - IFMT</option>

                    <option value="IFMS">Instituto Federal de Mato Grosso do Sul - IFMS</option>

                    <option value="IFMG">Instituto Federal de Minas Gerais - IFMG</option>

                    <option value="IFNMG">Instituto Federal do Norte de Minas Gerais - IFNMG</option>

                    <option value="IFSudesteMG">
                        Instituto Federal do Sudeste de Minas Gerais - IF Sudeste MG
                    </option>

                    <option value="IFSULDEMINAS">
                        Instituto Federal do Sul de Minas Gerais - IFSULDEMINAS
                    </option>

                    <option value="IFTM">
                        Instituto Federal do Triângulo Mineiro - IFTM
                    </option>

                    <option value="IFPA">Instituto Federal do Pará - IFPA</option>

                    <option value="IFPB">Instituto Federal da Paraíba - IFPB</option>

                    <option value="IFPR">Instituto Federal do Paraná - IFPR</option>

                    <option value="IFPE">Instituto Federal de Pernambuco - IFPE</option>

                    <option value="IFSertaoPE">
                        Instituto Federal do Sertão Pernambucano - IFSertãoPE
                    </option>

                    <option value="IFPI">Instituto Federal do Piauí - IFPI</option>

                    <option value="IFRJ">Instituto Federal do Rio de Janeiro - IFRJ</option>

                    <option value="IFF">Instituto Federal Fluminense - IFF</option>

                    <option value="IFRN">
                        Instituto Federal do Rio Grande do Norte - IFRN
                    </option>

                    <option value="IFRS">
                        Instituto Federal do Rio Grande do Sul - IFRS
                    </option>

                    <option value="IFFar">
                        Instituto Federal Farroupilha - IFFar
                    </option>

                    <option value="IFSul">
                        Instituto Federal Sul-rio-grandense - IFSul
                    </option>

                    <option value="IFRO">
                        Instituto Federal de Rondônia - IFRO
                    </option>

                    <option value="IFRR">
                        Instituto Federal de Roraima - IFRR
                    </option>

                    <option value="IFSC">
                        Instituto Federal de Santa Catarina - IFSC
                    </option>

                    <option value="IFC">
                        Instituto Federal Catarinense - IFC
                    </option>

                    <option value="IFSP">
                        Instituto Federal de São Paulo - IFSP
                    </option>

                    <option value="IFS">
                        Instituto Federal de Sergipe - IFS
                    </option>

                    <option value="IFTO">
                        Instituto Federal do Tocantins - IFTO
                    </option>

                </select>

            </div>

        </div>


        <div class="campo">

            <label for="campus">
                Campus:
            </label>

            <div class="campo__entrada">

                <input
                    type="text"
                    id="campus"
                    name="campus"
                    placeholder="Ex.: Campus Caxias do Sul"
                    required
                >

            </div>

        </div>


        <div class="campo">

            <label for="resumo">
                Resumo:
            </label>

            <div class="campo__entrada">

                <textarea
                    id="resumo"
                    name="resumo"
                    placeholder="Digite o resumo do trabalho"
                    maxlength="1000"
                    required
                ></textarea>

            </div>

            <small class="contador">
                <span id="contador-resumo">0</span>/1000 caracteres
            </small>

        </div>


        <div class="campo">

            <label for="palavras_chave">
                Palavras-chave:
            </label>

            <div class="campo__entrada">

                <input
                    type="text"
                    id="palavras_chave"
                    name="palavras_chave"
                    placeholder="Ex.: Tecnologia, Educação, Inteligência Artificial"
                    required
                >

            </div>

        </div>


        <div class="campo">

            <label for="area_conhecimento">
                Área do Conhecimento:
            </label>

            <div class="campo__entrada">

                <select
                    id="area_conhecimento"
                    name="area_conhecimento"
                    required
                >

                    <option value="" disabled selected>
                        Selecione uma área
                    </option>

                    <option value="Ciencias Exatas e da Terra">
                        Ciências Exatas e da Terra
                    </option>

                    <option value="Ciencias Biologicas">
                        Ciências Biológicas
                    </option>

                    <option value="Engenharias">
                        Engenharias
                    </option>

                    <option value="Ciencias da Saude">
                        Ciências da Saúde
                    </option>

                    <option value="Ciencias Agrarias">
                        Ciências Agrárias
                    </option>

                    <option value="Ciencias Sociais Aplicadas">
                        Ciências Sociais Aplicadas
                    </option>

                    <option value="Ciencias Humanas">
                        Ciências Humanas
                    </option>

                    <option value="Linguistica Letras e Artes">
                        Linguística, Letras e Artes
                    </option>

                    <option value="Multidisciplinar">
                        Multidisciplinar
                    </option>

                </select>

            </div>

        </div>


        <div class="campo">

            <label for="modalidade">
                Modalidade:
            </label>

            <div class="campo__entrada">

                <select
                    id="modalidade"
                    name="modalidade"
                    required
                >

                    <option value="" disabled selected>
                        Selecione uma modalidade
                    </option>

                    <option value="Ensino">
                        Ensino
                    </option>

                    <option value="Pesquisa">
                        Pesquisa
                    </option>

                    <option value="Extensao">
                        Extensão
                    </option>

                </select>

            </div>

        </div>


        <div class="arquivo">

            <label
                for="arquivo"
                class="botao-arquivo"
            >
                Adicionar arquivo
            </label>

            <input
                type="file"
                id="arquivo"
                name="arquivo"
                accept=".pdf,application/pdf"
                required
            >

            <span id="nome-arquivo">
                Nenhum arquivo selecionado
            </span>

        </div>


        <div class="formulario__acoes">

            <button
                type="submit"
                class="botao botao--principal"
            >
                ENVIAR
            </button>

        </div>


    </form>

</section>


<script>

    const arquivo =
        document.getElementById("arquivo");

    const nomeArquivo =
        document.getElementById("nome-arquivo");

    arquivo.addEventListener(
        "change",
        function () {

            if (arquivo.files.length > 0) {

                nomeArquivo.textContent =
                    arquivo.files[0].name;

            } else {

                nomeArquivo.textContent =
                    "Nenhum arquivo selecionado";

            }

        }
    );


    const resumo =
        document.getElementById("resumo");

    const contadorResumo =
        document.getElementById("contador-resumo");

    resumo.addEventListener(
        "input",
        function () {

            contadorResumo.textContent =
                resumo.value.length;

        }
    );

</script>

{% endblock %}
