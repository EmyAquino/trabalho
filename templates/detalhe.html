{% extends "base.html" %}
{% block titulo %}{{ t.titulo }} - PEnsE-Submite{% endblock %}

{% block conteudo %}
<article class="detalhe">
  <header class="detalhe__topo">
    <img class="detalhe__avatar" src="{{ url_for('static', filename='img/gato1.jpg') }}" alt="">
    <div>
      <h1>{{ t.titulo }}</h1>
      <p class="detalhe__meta">{{ t.modalidade }} - {{ t.autor }} ({{ t.campus }})</p>
    </div>
  </header>
  <p class="detalhe__resumo">{{ t.resumo }}</p>
  <div style="display: flex; gap: 12px; flex-wrap: wrap;">
    <a class="botao botao--contorno" href="{{ url_for('arquivo', id=t.id) }}" target="_blank" rel="noopener">Ver PDF</a>
    <a class="botao botao--contorno" href="{{ url_for('index') }}">Voltar</a>
  </div>
</article>
{% endblock %}
