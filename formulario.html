{% extends "base.html" %}

{% block titulo %}
Formulário de Submissão - PEnsE-Submite
{% endblock %}

{% block conteudo %}

<style>


    .formulario {
        max-width: 650px;
        margin: 35px auto;
        padding: 30px 40px;
        background-color: #b8b8b8;
        border-radius: 25px;
        box-sizing: border-box;
    }

    .formulario__titulo {
        background-color: #ffffff;
        color: #59683d;
        text-align: center;
        font-size: 26px;
        font-weight: normal;

        padding: 12px;
        margin: -10px 0 30px 0;

        border-radius: 8px;
    }


    .campo {
        margin-bottom: 22px;
    }

    .campo label {
        display: block;
        margin-bottom: 7px;

        color: #222222;
        font-size: 18px;
    }

    .campo__entrada {
        border-bottom: 3px solid #b4e337;
    }

    .campo__entrada input,
    .campo__entrada textarea {
        width: 100%;
        padding: 8px 5px;

        border: none;
        outline: none;

        background-color: transparent;

        font-size: 16px;
        font-family: inherit;

        box-sizing: border-box;
    }

    .campo__entrada input::placeholder,
    .campo__entrada textarea::placeholder {
        color: #666666;
    }


    .campo__entrada textarea {
        min-height: 90px;
        resize: vertical;
    }



    .modalidade {
        margin: 10px 0 22px 0;
        padding: 0;

        border: none;
    }

    .modalidade legend {
        margin-bottom: 10px;

        font-size: 18px;
        color: #222222;
    }

    .modalidade__opcao {
        display: block;

        margin-bottom: 7px;

        font-size: 16px;

        cursor: pointer;
    }

    .modalidade__opcao input {
        margin-right: 7px;
        accent-color: #a8cf45;
    }


    .arquivo {
        margin-top: 20px;
        margin-bottom: 25px;

        display: flex;
        flex-direction: column;
        align-items: flex-start;

        gap: 8px;
    }

    .arquivo input[type="file"] {
        display: none;
    }

    .botao-arquivo {
        display: inline-block;

        background-color: #ffffff;
        color: #59683d;

        padding: 8px 18px;

        border-radius: 8px;

        cursor: pointer;

        font-size: 16px;

        transition: 0.2s;
    }

    .botao-arquivo:hover {
        background-color: #a8cf45;
        color: #ffffff;
    }

    #nome-arquivo {
        color: #555555;
        font-size: 13px;

        word-break: break-word;
    }


    .formulario__acoes {
        display: flex;
        justify-content: flex-end;

        margin-top: 15px;
    }

    .botao--principal {
        background-color: #ffffff;
        color: #59683d;

        border: none;
        border-radius: 8px;

        padding: 10px 30px;

        font-size: 17px;
        font-family: inherit;

        cursor: pointer;

        transition: 0.2s;
    }

    .botao--principal:hover {
        background-color: #a8cf45;
        color: #ffffff;
    }


    @media (max-width: 700px) {

        .formulario {
            margin: 20px 15px;
            padding: 25px 20px;
        }

        .formulario__titulo {
            font-size: 21px;
        }

        .formulario__acoes {
            justify-content: center;
        }
    }

</style>


<section class="formulario">

    <h1 class="formulario__titulo">
        Formulário de Submissão
    </h1>

    <form method="POST" enctype="multipart/form-data">


        <div class="campo">

            <label for="titulo">
                Título do Trabalho:
            </label>

            <div class="campo__entrada">

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Digite o título do trabalho"
                    required
                >

            </div>

        </div>


        <div class="campo">

            <label for="autor">
                Nome do Autor:
            </label>

            <div class="campo__entrada">

                <input
                    type="text"
                    id="autor"
                    name="autor"
                    placeholder="Digite o nome do autor"
                    required
                >

            </div>

        </div>


        <div class="campo">

            <label for="campus">
                Campus/Instituição:
            </label>

            <div class="campo__entrada">

                <input
                    type="text"
                    id="campus"
                    name="campus"
                    placeholder="Ex.: IFRS - Campus Caxias do Sul"
                    required
                >

            </div>

        </div>


        <div class="campo">

            <label for="resumo">
                Resumo:
            </label>

            <div class="campo__entrada">

                <textarea
                    id="resumo"
                    name="resumo"
                    placeholder="Digite o resumo do trabalho"
                    required
                ></textarea>

            </div>

        </div>


        <fieldset class="modalidade">

            <legend>
                Modalidade:
            </legend>

            {% for modalidade in modalidades %}

                <label class="modalidade__opcao">

                    <input
                        type="radio"
                        name="modalidade"
                        value="{{ modalidade }}"
                        required
                    >

                    {{ modalidade }}

                </label>

            {% endfor %}

        </fieldset>


        <div class="arquivo">

            <label
                for="arquivo"
                class="botao-arquivo"
            >
                Adicionar arquivo
            </label>

            <input
                type="file"
                id="arquivo"
                name="arquivo"
                accept=".pdf"
            >

            <span id="nome-arquivo">
                Nenhum arquivo selecionado
            </span>

        </div>


        <div class="formulario__acoes">

            <button
                type="submit"
                class="botao botao--principal"
            >
                ENVIAR
            </button>

        </div>

    </form>

</section>


<script>

    const arquivo =
        document.getElementById("arquivo");

    const nomeArquivo =
        document.getElementById("nome-arquivo");


    arquivo.addEventListener(
        "change",
        function () {

            if (arquivo.files.length > 0) {

                nomeArquivo.textContent =
                    arquivo.files[0].name;

            } else {

                nomeArquivo.textContent =
                    "Nenhum arquivo selecionado";

            }

        }
    );

</script>

{% endblock %}
